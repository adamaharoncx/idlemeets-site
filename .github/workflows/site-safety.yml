name: Website safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  footer-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/site-safety.test.mjs
      - run: node scripts/check-site.mjs --ref HEAD --base "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
