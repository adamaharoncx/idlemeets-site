<svg xmlns="http://www.w3.org/2000/svg" width="600" height="760" viewBox="0 0 600 760" role="img" aria-labelledby="title desc">
  <title id="title">What the three flyer Look controls change</title>
  <desc id="desc">Dim darkens the photo without tinting it. Accent glow adds soft color and turns off at the far left. Accent color chooses the color for glow and Accent text. This is an explanatory diagram, not an app screen.</desc>
  <defs><linearGradient id="shade"><stop stop-color="#d4d4d4"/><stop offset="1" stop-color="#292929"/></linearGradient><radialGradient id="glow"><stop stop-color="#8ab9f2" stop-opacity=".85"/><stop offset="1" stop-color="#8ab9f2" stop-opacity="0"/></radialGradient></defs>
  <rect width="600" height="760" fill="#090909"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#f5f5f5">
    <text x="32" y="46" font-size="22" fill="#aaa" letter-spacing="2">FLYER LOOK EXPLAINED</text>
    <line x1="32" y1="74" x2="568" y2="74" stroke="#333"/>
    <text x="32" y="128" font-size="34" font-weight="700">Dim</text>
    <rect x="32" y="152" width="536" height="42" rx="8" fill="url(#shade)"/>
    <text x="32" y="235" font-size="28">Darkens the photo.</text>
    <text x="32" y="271" font-size="28" fill="#bbb">No added color tint.</text>
    <line x1="32" y1="308" x2="568" y2="308" stroke="#333"/>
    <text x="32" y="362" font-size="34" font-weight="700">Accent glow</text>
    <ellipse cx="300" cy="406" rx="268" ry="38" fill="url(#glow)"/>
    <text x="32" y="463" font-size="28">Adds soft color glow and tint.</text>
    <text x="32" y="499" font-size="28" fill="#bbb">All the way left turns it off.</text>
    <line x1="32" y1="536" x2="568" y2="536" stroke="#333"/>
    <text x="32" y="590" font-size="34" font-weight="700">Accent color</text>
    <circle cx="53" cy="628" r="18" fill="#8ab9f2"/><text x="89" y="638" font-size="28" fill="#8ab9f2">Your chosen color</text>
    <text x="32" y="686" font-size="28">Used for glow and Accent text.</text>
    <text x="32" y="731" font-size="20" fill="#aaa">EXPLANATORY DIAGRAM · NOT AN APP SCREEN</text>
  </g>
</svg>
